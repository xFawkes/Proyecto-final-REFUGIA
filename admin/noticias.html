<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REFUGIA | Publicación de noticias</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Myanmar+Khyay&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="../css/admin/noticias.css">

  <!-- CRUD de noticias: js/admin/noticias.js usa la API (GET, POST, PUT y DELETE /api/noticias) -->
  <script src="../js/api.js" defer></script>
  <script src="../js/sesion.js" defer></script>  <!-- solo administradores; cerrar sesión -->
  <script src="../js/admin/noticias.js" defer></script>
</head>
<body class="pagina" data-requiere="admin">
  <div class="admin">

    <!-- ===================== MENÚ LATERAL ===================== -->
    <aside class="menu">
      <div class="menu__marca">
        <span class="menu__logo">REFUGIA</span>
        <span class="menu__subtitulo">Administración</span>
      </div>

      <input type="checkbox" id="menu-toggle" class="menu__toggle">
      <label for="menu-toggle" class="menu__hamburguesa" aria-label="Abrir menú">
        <i class="bi bi-list" aria-hidden="true"></i>
      </label>

      <nav class="menu__lista" aria-label="Navegación de administración">
        <a href="inicio.html" class="menu__enlace">Panel</a>
        <a href="noticias.html" class="menu__enlace menu__enlace--activo" aria-current="page">Noticias</a>
        <a href="foro.html" class="menu__enlace">Foro</a>
        <a href="voluntariados.html" class="menu__enlace">Voluntariados</a>
        <a href="donaciones.html" class="menu__enlace">Donaciones</a>
        <a href="usuarios.html" class="menu__enlace">Usuarios</a>
        <a href="../inicio.html" class="menu__enlace" data-cerrar-sesion>Cerrar sesión</a>
      </nav>
    </aside>


    <!-- ===================== CONTENIDO ===================== -->
    <main class="contenido">
      <div class="contenido__interior">
        <h1 class="contenido__titulo">Publicación de Noticias</h1>

        <!-- Mensajes del sistema (guardado, errores de la API…) -->
        <p class="aviso" id="aviso" role="status" hidden></p>

        <!-- ===================== FORMULARIO (crear / editar) ===================== -->
        <section class="tarjeta" aria-labelledby="titulo-formulario">
          <h2 class="tarjeta__titulo" id="titulo-formulario">Nueva noticia</h2>

          <form class="formulario" id="formulario-noticia" novalidate>
            <p class="formulario__nota">Los campos con <span aria-hidden="true">*</span><span class="visualmente-oculto">asterisco</span> son obligatorios.</p>

            <div class="formulario__grupo">
              <label class="formulario__etiqueta" for="titulo">Titulo *</label>
              <input class="formulario__campo" type="text" id="titulo" name="titulo" placeholder="Título de la noticia" required minlength="5" maxlength="200" aria-describedby="error-titulo">
              <p class="formulario__error" id="error-titulo"></p>
            </div>

            <div class="formulario__fila">
              <div class="formulario__grupo">
                <label class="formulario__etiqueta" for="fuente">Fuente *</label>
                <input class="formulario__campo" type="text" id="fuente" name="fuente" placeholder="Nombre de la entidad oficial" required minlength="2" maxlength="150" aria-describedby="error-fuente">
                <p class="formulario__error" id="error-fuente"></p>
              </div>

              <div class="formulario__grupo">
                <label class="formulario__etiqueta" for="fecha_publicacion">Fecha de publicación</label>
                <input class="formulario__campo" type="date" id="fecha_publicacion" name="fecha_publicacion" aria-describedby="error-fecha_publicacion">
                <p class="formulario__error" id="error-fecha_publicacion"></p>
              </div>
            </div>

            <div class="formulario__grupo">
              <label class="formulario__etiqueta" for="enlace">Enlace al canal oficial</label>
              <input class="formulario__campo" type="url" id="enlace" name="enlace" placeholder="https://" maxlength="500" aria-describedby="error-enlace">
              <p class="formulario__error" id="error-enlace"></p>
            </div>

            <div class="formulario__grupo">
              <label class="formulario__etiqueta" for="verificacion">Nivel de verificación</label>
              <select class="formulario__campo" id="verificacion" name="verificacion" aria-describedby="error-verificacion">
                <option value="oficial">Oficial</option>
                <option value="en_verificacion">En verificación</option>
                <option value="sin_verificar">Sin verificar</option>
              </select>
              <p class="formulario__error" id="error-verificacion"></p>
            </div>

            <!-- Imagen: se sube a la API (POST /api/noticias/imagen) al guardar -->
            <fieldset class="formulario__grupo formulario__imagen">
              <legend class="formulario__etiqueta">Imagen</legend>
              <div class="imagen__vista" id="imagen-vista" hidden>
                <img id="imagen-previa" src="data:," alt="Vista previa de la imagen de la noticia">
                <button type="button" class="formulario__boton formulario__boton--secundario" id="btn-quitar-imagen">Quitar imagen</button>
              </div>
              <label class="formulario__etiqueta formulario__etiqueta--sub" for="archivo-imagen">Subir imagen (PNG, JPG, WEBP o GIF, máximo 5 MB)</label>
              <input class="formulario__campo" type="file" id="archivo-imagen" accept="image/png,image/jpeg,image/webp,image/gif" aria-describedby="error-imagen">
              <p class="formulario__error" id="error-imagen"></p>

              <label class="formulario__etiqueta formulario__etiqueta--sub" for="imagen_alt">Descripción de la imagen (para lectores de pantalla)</label>
              <input class="formulario__campo" type="text" id="imagen_alt" name="imagen_alt" maxlength="200" placeholder="Ej.: Familias recibiendo mercados en un centro de acopio" aria-describedby="error-imagen_alt">
              <p class="formulario__error" id="error-imagen_alt"></p>
            </fieldset>

            <div class="formulario__grupo">
              <label class="formulario__etiqueta" for="contenido">Contenido de la noticia *</label>
              <textarea class="formulario__campo formulario__campo--grande" id="contenido" name="contenido" placeholder="Escribe aquí el resumen o el contenido de la noticia. Deja una línea en blanco para separar párrafos." required minlength="10" maxlength="5000" aria-describedby="error-contenido"></textarea>
              <p class="formulario__error" id="error-contenido"></p>
            </div>

            <div class="formulario__casilla">
              <input type="checkbox" id="destacada" name="destacada">
              <label for="destacada">Destacar en la parte superior de Noticias (reemplaza a la destacada actual)</label>
            </div>

            <div class="formulario__acciones">
              <button type="submit" class="formulario__boton formulario__boton--aprobar" id="btn-aprobar" value="publicar">Aprobar</button>
              <button type="submit" class="formulario__boton formulario__boton--secundario" id="btn-borrador" value="borrador">Guardar borrador</button>
              <button type="button" class="formulario__boton formulario__boton--eliminar" id="btn-eliminar" hidden>Eliminar</button>
              <button type="button" class="formulario__boton formulario__boton--secundario" id="btn-cancelar" hidden>Cancelar edición</button>
            </div>
          </form>
        </section>

        <!-- ===================== LISTADO ===================== -->
        <section class="tarjeta listado" aria-labelledby="titulo-listado">
          <div class="listado__cabecera">
            <h2 class="tarjeta__titulo" id="titulo-listado">Noticias registradas</h2>
            <div class="listado__filtro">
              <label class="formulario__etiqueta" for="filtro-estado">Mostrar</label>
              <select class="formulario__campo" id="filtro-estado">
                <option value="">Todas</option>
                <option value="true">Publicadas</option>
                <option value="false">Borradores</option>
              </select>
            </div>
          </div>
          <p class="listado__estado" id="listado-estado" role="status">Cargando noticias…</p>
          <ul class="listado__lista" id="listado"></ul>
        </section>
      </div>
    </main>

  </div>

  <!-- Confirmación antes de eliminar -->
  <dialog class="dialogo" id="dialogo-eliminar" aria-labelledby="dialogo-titulo" aria-describedby="dialogo-texto">
    <h2 class="dialogo__titulo" id="dialogo-titulo">¿Eliminar esta noticia?</h2>
    <p class="dialogo__texto" id="dialogo-texto"></p>
    <form method="dialog" class="formulario__acciones">
      <button type="submit" class="formulario__boton formulario__boton--eliminar" value="eliminar">Eliminar</button>
      <button type="submit" class="formulario__boton formulario__boton--secundario" value="cancelar" autofocus>Cancelar</button>
    </form>
  </dialog>
</body>
</html>
