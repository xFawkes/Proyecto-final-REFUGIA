<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REFUGIA | Moderador Foro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Myanmar+Khyay&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/admin/foro.css">

  <!-- Moderación: js/admin/foro.js usa la API (GET, PUT y DELETE /api/foro/...) -->
  <script src="../js/api.js" defer></script>
  <script src="../js/admin/foro.js" defer></script>
</head>
<body>
  <div class="admin">

    <!--  MENÚ  -->
    <aside class="menu">
      <div class="menu__marca">
        <span class="menu__logo">REFUGIA</span>
        <span class="menu__subtitulo">Administración</span>
      </div>

      <input type="checkbox" id="menu-toggle" class="menu__toggle">
      <label for="menu-toggle" class="menu__hamburguesa" aria-label="Abrir menú">
        <i class="bi bi-list" aria-hidden="true"></i>
      </label>

      <nav class="menu__lista" aria-label="Navegación de administración">
        <a href="inicio.html" class="menu__enlace">Panel</a>
        <a href="noticias.html" class="menu__enlace">Noticias</a>
        <a href="foro.html" class="menu__enlace menu__enlace--activo" aria-current="page">Foro</a>
        <a href="voluntariados.html" class="menu__enlace">Voluntariados</a>
        <a href="donaciones.html" class="menu__enlace">Donaciones</a>
        <a href="../inicio.html" class="menu__enlace">Cerrar sesion</a>
      </nav>
    </aside>


    <!--  CONTENIDO  -->
    <main class="contenido">
      <div class="contenido__interior">
        <h1 class="contenido__titulo">Moderador Foro</h1>

        <p class="aviso" id="aviso" role="status" hidden></p>

        <form class="filtros" id="filtros" role="search" aria-label="Filtrar publicaciones" autocomplete="off">
          <div class="filtros__grupo">
            <label for="filtro-revision">Mostrar</label>
            <select id="filtro-revision">
              <option value="pendiente">Por revisar</option>
              <option value="ocultas">Ocultas</option>
              <option value="">Todas</option>
            </select>
          </div>
          <div class="filtros__grupo filtros__grupo--ancho">
            <label for="filtro-q">Buscar</label>
            <input type="search" id="filtro-q" maxlength="100" placeholder="Título, autor o lugar">
          </div>
          <button type="submit" class="boton boton--aprobar">Buscar</button>
        </form>

        <p class="moderacion__estado" id="moderacion-estado" role="status">Cargando publicaciones…</p>

        <!-- Las publicaciones las pinta js/admin/foro.js (GET /api/foro/publicaciones?moderacion=true) -->
        <section class="moderacion" id="moderacion" aria-label="Publicaciones por moderar"></section>
        <button type="button" class="boton boton--secundario moderacion__mas" id="moderacion-mas" hidden>Ver más</button>
      </div>
    </main>

  </div>

  <!-- Confirmación antes de eliminar -->
  <dialog class="dialogo" id="dialogo-confirmar" aria-labelledby="dialogo-titulo" aria-describedby="dialogo-texto">
    <h2 class="dialogo__titulo" id="dialogo-titulo"></h2>
    <p class="dialogo__texto" id="dialogo-texto"></p>
    <form method="dialog" class="publicacion__acciones">
      <button type="submit" class="boton boton--eliminar" value="confirmar">Eliminar</button>
      <button type="submit" class="boton boton--secundario" value="cancelar" autofocus>Cancelar</button>
    </form>
  </dialog>
</body>
</html>
