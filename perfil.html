<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>REFUGIA | Mi perfil</title>

    <!--Fuentes-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Myanmar+Khyay&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">

    <!--Bootstrap Icons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!--CSS-->
    <link rel="stylesheet" href="css/perfil.css">
    <link rel="stylesheet" href="css/MenuUsuario.css">
</head>
<body class="pagina">

    <!-- ===================== ENCABEZADO ===================== -->
    <header class="encabezado">
        <a href="inicio.html" class="encabezado__logo" aria-label="Ir al inicio">
            <img class="encabezado__imagen" src="imags/logo 1.png" alt="Logo de REFUGIA">
        </a>

        <input type="checkbox" id="menu-toggle" class="encabezado__toggle">
        <label for="menu-toggle" class="encabezado__hamburguesa" aria-label="Abrir menú">
            <i class="bi bi-list" aria-hidden="true"></i>
        </label>

        <nav class="navegacion" aria-label="Navegación principal">
            <ul class="navegacion__lista">
                <li class="navegacion__item"><a href="mapa.html" class="navegacion__enlace">Mapas</a></li>
                <li class="navegacion__item"><a href="voluntariado.html" class="navegacion__enlace">Voluntariados</a></li>
                <li class="navegacion__item"><a href="noticias.html" class="navegacion__enlace">Noticias</a></li>
                <li class="navegacion__item"><a href="foro.html" class="navegacion__enlace">Foro</a></li>
                <li class="navegacion__item"><a href="donaciones.html" class="navegacion__enlace">Donaciones</a></li>
                <li class="navegacion__item"><a href="ayuda.html" class="navegacion__enlace">Preguntas frecuentes</a></li>
            </ul>
        </nav>

        <!-- Menú de usuario: se abre al presionar el ícono de perfil (solo CSS, sin JS) -->
        <input type="checkbox" id="menu-usuario" class="usuario-menu__toggle">
        <label for="menu-usuario" class="perfil" id="btn-perfil" aria-label="Abrir menú de usuario">
          <i class="bi bi-person-fill" aria-hidden="true"></i>
        </label>

        <label for="menu-usuario" class="usuario-menu__fondo" aria-hidden="true"></label>

        <div class="usuario-menu" aria-label="Menú de usuario">
          <label for="menu-usuario" class="usuario-menu__cerrar" aria-label="Cerrar menú de usuario">
            <i class="bi bi-x-lg" aria-hidden="true"></i>
          </label>

          <div class="usuario-menu__cabecera">
            <div class="usuario-menu__avatar">
              <i class="bi bi-person-fill usuario-menu__avatar-icono" aria-hidden="true"></i>
            </div>
            <p class="usuario-menu__nombre">TU NOMBRE</p>
            <p class="usuario-menu__id">ID:123456789 #LAN</p>
          </div>

          <ul class="usuario-menu__lista">
            <li class="usuario-menu__elemento">
              <a href="perfil.html" class="usuario-menu__enlace">
                <i class="bi bi-person usuario-menu__icono" aria-hidden="true"></i>
                <span class="usuario-menu__texto">Mi Perfil</span>
              </a>
            </li>
            <li class="usuario-menu__elemento">
              <a href="error.html" class="usuario-menu__enlace">
                <i class="bi bi-gear-fill usuario-menu__icono" aria-hidden="true"></i>
                <span class="usuario-menu__texto">Configuración</span>
              </a>
            </li>
            <li class="usuario-menu__elemento">
              <a href="error.html" class="usuario-menu__enlace">
                <i class="bi bi-bell-fill usuario-menu__icono" aria-hidden="true"></i>
                <span class="usuario-menu__texto">Notificaciones</span>
              </a>
            </li>
            <li class="usuario-menu__elemento">
              <a href="inicio.html" class="usuario-menu__enlace">
                <i class="bi bi-box-arrow-right usuario-menu__icono" aria-hidden="true"></i>
                <span class="usuario-menu__texto">Cerrar Sesión</span>
              </a>
            </li>
          </ul>
        </div>
    </header>

    <main class="contenido">

        <!-- ===================== TARJETA DE USUARIO ===================== -->
        
        <section class="usuario" aria-labelledby="usuario-id">

            <input type="checkbox" id="modo-edicion" class="usuario__toggle">

            <!-- CABECERA -->
            <div class="usuario__cabecera">

                <div class="usuario__avatar">
                    <i class="bi bi-person-fill usuario__avatar-icono"></i>
                </div>

                <h1 class="usuario__id" id="usuario-id">
                    ID: 123456789 #LAN
                </h1>

                <!-- EDITAR -->
                <label for="modo-edicion" class="usuario__editar"
                    aria-label="Editar perfil">
                    <i class="bi bi-pencil-fill"></i>
                </label>

                <!-- GUARDAR Y CANCELAR -->
                <div class="usuario__acciones">
                    <label for="modo-edicion" class="usuario__guardar">
                        Guardar
                    </label>

                    <label for="modo-edicion" class="usuario__cancelar">
                        Cancelar
                    </label>
                </div>

            </div>

            <!-- DATOS -->
            <div class="usuario__datos">

                <div class="usuario__dato">
                    <label class="usuario__etiqueta" for="nombre">Nombre:</label>
                    <input class="usuario__valor" id="nombre"
                        type="text" value="Tú nombre">
                </div>

                <div class="usuario__dato">
                    <label class="usuario__etiqueta" for="correo">Correo:</label>
                    <input class="usuario__valor" id="correo"
                        type="email" value="Tunombre@gmail.com">
                </div>

                <div class="usuario__dato">
                    <label class="usuario__etiqueta" for="numero">Número:</label>
                    <input class="usuario__valor" id="numero"
                        type="tel" value="Añadir número">
                </div>

                <div class="usuario__dato">
                    <label class="usuario__etiqueta" for="locacion">Locación:</label>
                    <input class="usuario__valor" id="locacion"
                        type="text" value="COLOMBIA">
                </div>

            </div>

        </section>

    </main>

  <!-- Botones de accesibilidad (la funcionalidad se programa con JS) -->
  <div class="accesibilidad" role="group" aria-label="Opciones de accesibilidad">
    <button type="button" class="accesibilidad__boton" id="btn-lector-voz" aria-label="Leer en voz alta">
      <i class="bi bi-volume-up-fill" aria-hidden="true"></i>
    </button>
    <button type="button" class="accesibilidad__boton" id="btn-contraste" aria-label="Modo de alto contraste">
      <i class="bi bi-eye-fill" aria-hidden="true"></i>
    </button>
    <button type="button" class="accesibilidad__boton" id="btn-zoom" aria-label="Ampliar texto">
      <i class="bi bi-zoom-in" aria-hidden="true"></i>
    </button>
  </div>

</body>
</html>
