<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REFUGIA | Registro</title>
  <meta name="description" content="Crea tu cuenta en REFUGIA para publicar en el foro y gestionar tu perfil.">

  <!--Fuentes-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Myanmar+Khyay&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">

  <!--Bootstrap Icons-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!--CSS-->
  <link rel="stylesheet" href="css/sesion.css">
  <link rel="stylesheet" href="css/accesibilidad.css">
  <!--API Accesibilidad-->
  <script src="js/accesibilidad.js"></script>
  <!--API de REFUGIA: registro (js/acceso.js)-->
  <script src="js/api.js" defer></script>
  <script src="js/acceso.js" defer></script>
</head>
<body class="pagina">

  <!-- ===================== ENCABEZADO ===================== -->
  <header class="encabezado">
    <a href="inicio.html" class="encabezado__logo" aria-label="Ir al inicio">
      <img class="encabezado__imagen" src="img/logo-refugia.png" alt="Logo de REFUGIA">
    </a>
  </header>

  <main class="contenido">

    <!-- ===================== TARJETA: FORMULARIO + FOTO ===================== -->
    <section class="acceso acceso--registro" aria-labelledby="titulo-acceso">
      <div class="acceso__panel">
        <h1 class="acceso__titulo" id="titulo-acceso">Registro</h1>

        <p class="acceso__aviso" id="aviso-acceso" hidden></p>

        <form class="acceso__formulario" id="form-registro" novalidate>
          <div class="acceso__campo">
            <label for="campo-nombre-usuario">Nombre de usuario</label>
            <input type="text" id="campo-nombre-usuario" name="nombre_usuario" maxlength="30" autocomplete="username"
                   autocapitalize="none" spellcheck="false" required
                   aria-describedby="ayuda-nombre-usuario error-nombre_usuario">
            <p class="acceso__ayuda" id="ayuda-nombre-usuario">De 3 a 30 caracteres, sin espacios ni tildes. Ej.: ana.gomez</p>
            <p class="acceso__error-campo" id="error-nombre_usuario"></p>
          </div>

          <div class="acceso__campo">
            <label for="campo-correo">Correo electrónico</label>
            <input type="email" id="campo-correo" name="correo" maxlength="120" autocomplete="email"
                   autocapitalize="none" spellcheck="false" required aria-describedby="error-correo">
            <p class="acceso__error-campo" id="error-correo"></p>
          </div>

          <div class="acceso__campo">
            <label for="campo-contrasena">Contraseña</label>
            <input type="password" id="campo-contrasena" name="contrasena" maxlength="128" autocomplete="new-password"
                   required aria-describedby="ayuda-contrasena error-contrasena">
            <p class="acceso__ayuda" id="ayuda-contrasena">Mínimo 8 caracteres, con letras y números.</p>
            <p class="acceso__error-campo" id="error-contrasena"></p>
          </div>

          <p class="acceso__enlaces">
            ¿Ya tienes cuenta? <a class="acceso__enlace" href="iniciar-sesion.html" id="enlace-otra-pagina">Inicia sesión</a>
          </p>

          <p class="acceso__alerta" id="alerta-acceso" role="alert"></p>

          <button type="submit" class="acceso__boton">Registrarse</button>
        </form>
      </div>

      <img class="acceso__foto" src="img/sesion/manos-unidas.jpg" alt=""
           width="328" height="365">
    </section>

    <!-- Botones de accesibilidad (js/accesibilidad.js): dentro de <main> para que estén en una región -->
    <div class="accesibilidad" role="group" aria-label="Opciones de accesibilidad">
      <button type="button" class="accesibilidad__boton" id="btn-lector-voz" aria-label="Leer en voz alta">
        <i class="bi bi-volume-up-fill" aria-hidden="true"></i>
      </button>
      <button type="button" class="accesibilidad__boton" id="btn-contraste" aria-label="Modo de alto contraste">
        <i class="bi bi-eye-fill" aria-hidden="true"></i>
      </button>
      <button type="button" class="accesibilidad__boton" id="btn-zoom" aria-label="Ampliar texto">
        <i class="bi bi-zoom-in" aria-hidden="true"></i>
      </button>
    </div>

  </main>

</body>
</html>
